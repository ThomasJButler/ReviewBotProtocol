name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, 'v*']
  pull_request:

jobs:
  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*
      - name: Install
        run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Audit
        run: pip install pip-audit && pip-audit -r requirements.lock

  frontend:
    name: Frontend lint, types, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@11 && npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Audit
        run: npm audit --audit-level=high
