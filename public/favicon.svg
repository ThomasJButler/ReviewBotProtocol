<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="32" height="32" fill="#0a0a0a" rx="4"/>

  <!-- Border -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#00ff00" stroke-width="1" rx="3" opacity="0.5"/>

  <!-- RBP Letters -->
  <text x="16" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="url(#favGradient)" text-anchor="middle">
    RB
  </text>

  <!-- Protocol P -->
  <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#00ffff" text-anchor="middle">
    P://
  </text>
</svg>