<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="60" fill="#0a0a0a" rx="4"/>

  <!-- Border with glow effect -->
  <rect x="1" y="1" width="198" height="58" fill="none" stroke="#00ff00" stroke-width="1" rx="3" opacity="0.5"/>

  <!-- RBP Text -->
  <text x="15" y="35" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="bold" fill="url(#matrixGradient)" filter="url(#glow)">
    RBP://
  </text>

  <!-- Protocol text -->
  <text x="90" y="35" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" fill="#c7c7c7">
    protocol
  </text>

  <!-- Animated cursor -->
  <rect x="160" y="22" width="2" height="16" fill="#00ff00">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Bot indicator dots -->
  <circle cx="180" cy="30" r="2" fill="#00ff00" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="188" cy="30" r="2" fill="#00ffff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>