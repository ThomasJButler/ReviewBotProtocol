<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="protocolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="60" fill="#ffffff" rx="4"/>

  <!-- Border -->
  <rect x="1" y="1" width="198" height="58" fill="none" stroke="#008800" stroke-width="1" rx="3" opacity="0.3"/>

  <!-- RBP Text -->
  <text x="15" y="35" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="bold" fill="url(#protocolGradient)">
    RBP://
  </text>

  <!-- Protocol text -->
  <text x="90" y="35" font-family="'JetBrains Mono', monospace" font-size="14" fill="#333333">
    protocol
  </text>

  <!-- Bot indicator -->
  <rect x="160" y="22" width="2" height="16" fill="#008800"/>
</svg>