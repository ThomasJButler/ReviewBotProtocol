<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="60" fill="#0a0a0a" rx="4"/>

  <!-- RBP Text -->
  <text x="15" y="35" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="bold" fill="url(#matrixGradientDark)">
    RBP://
  </text>

  <!-- Protocol text -->
  <text x="125" y="35" font-family="'JetBrains Mono', monospace" font-size="14" fill="#c7c7c7">
    protocol
  </text>

  <!-- Bot indicator -->
  <rect x="160" y="22" width="2" height="16" fill="#00ff00"/>
</svg>