[tool:pytest]
# Pytest configuration for Git Review Assistant Backend

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers for test organization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests that take more than 5 seconds
    auth: Authentication related tests
    webhook: Webhook processing tests
    review: Code review functionality tests
    security: Security related tests
    performance: Performance tests
    database: Database related tests

# Async test configuration
asyncio_mode = auto

# Test coverage (if pytest-cov is installed)
# --cov=.
# --cov-report=html
# --cov-report=term-missing
# --cov-fail-under=80

# Logging during tests
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pydantic.*
    ignore::UserWarning:langchain.*