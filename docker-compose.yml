# Git Review Assistant - Full Stack Docker Compose
# Course Project: AI-Powered Code Review System

version: '3.8'

services:
  # ======================
  # Frontend - Next.js 15
  # ======================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: git-review-assistant-frontend
    ports:
      - "3000:3000"
    environment:
      # App Configuration
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=Git Review Assistant

      # Backend Connection
      - BACKEND_URL=http://backend:8000

      # NextAuth (if using)
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}

      # GitHub OAuth
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}

      # AI Services (Frontend may need these for API routes)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
    env_file:
      - .env.local
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - git-review-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ======================
  # Backend - FastAPI
  # ======================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: git-review-assistant-backend
    ports:
      - "8000:8000"
    environment:
      # App Configuration
      - APP_NAME=Git Review Assistant API
      - APP_VERSION=1.0.0
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-2}

      # AI Services
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # GitHub Integration
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}

      # Database (Optional - SQLite used by default)
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./reviews.db}

      # Redis (Optional - for background jobs)
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

      # Monitoring (Optional)
      - SENTRY_DSN=${SENTRY_DSN}

      # Feature Flags
      - DEMO_MODE=${DEMO_MODE:-false}
    env_file:
      - ./backend/.env
    volumes:
      # Mount code for development hot-reload (comment out in production)
      - ./backend:/app
      # Persist SQLite database
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - git-review-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ======================
  # PostgreSQL (Optional)
  # Uncomment if using PostgreSQL instead of SQLite
  # ======================
  # db:
  #   image: postgres:15-alpine
  #   container_name: git-review-assistant-db
  #   environment:
  #     POSTGRES_DB: git_review_assistant
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - git-review-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ======================
  # Redis (Optional - for background jobs)
  # ======================
  redis:
    image: redis:7-alpine
    container_name: git-review-assistant-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - git-review-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================
  # Celery Worker (Optional - for async review processing)
  # Uncomment if using background job processing
  # ======================
  # worker:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: git-review-assistant-worker
  #   command: celery -A services.queue_processor worker --loglevel=info
  #   environment:
  #     - REDIS_URL=redis://redis:6379
  #     - DATABASE_URL=${DATABASE_URL:-sqlite:///./reviews.db}
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #     - GITHUB_APP_ID=${GITHUB_APP_ID}
  #     - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
  #   env_file:
  #     - ./backend/.env
  #   volumes:
  #     - ./backend:/app
  #   depends_on:
  #     - redis
  #     - backend
  #   networks:
  #     - git-review-network
  #   restart: unless-stopped

# ======================
# Volumes
# ======================
volumes:
  backend_data:
    driver: local
  redis_data:
    driver: local
  # postgres_data:
  #   driver: local

# ======================
# Networks
# ======================
networks:
  git-review-network:
    driver: bridge
    name: git-review-assistant-network